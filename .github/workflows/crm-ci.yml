name: CIU CRM Quality Checks

on:
  push:
    branches:
      - deploy/ciu-crm
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible dependency security updates
        run: npm audit fix

      - name: Verify dependency security
        run: npm audit --audit-level=high

      - name: Commit dependency lockfile updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lockfile changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(crm): apply compatible npm security updates"
            git push
          fi

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
